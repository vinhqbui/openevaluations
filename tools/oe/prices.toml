# Fallback prices for `oe budget`, in USD per million tokens, used only when a trial reports no
# cost (Harbor's codex adapter never does without litellm). Check them against the providers'
# price pages before each PREREG; a stale row only weakens the budget guard, never a result.
checked = "2026-11-10"
# 2026-11-10: Claude rows from https://platform.claude.com/docs/en/about-claude/pricing and
# https://claude.com/pricing (Sonnet 5.5: $2 input, $2.50 5-minute cache write, $0.10 cache hit,
# $10 output; Haiku 5.5 up to 100k-token prompts: $0.10, $0.125, $0.01, $0.50). DeepSeek rows: see
# the note above them.

[models.claude-haiku-5-5]
input = 0.10
cache_read = 0.01
output = 0.50

[models.claude-sonnet-5-5]
input = 2.0
cache_read = 0.10
output = 10.0

[models.deepseek-flash]
input = 0.30
cache_read = 0.006
output = 1.20

# DeepSeek rows: https://api-docs.deepseek.com/quick_start/pricing, checked 2026-11-10.
# DeepSeek bills off-peak at half these rates; the rows are the peak rates (01:00-04:00 and
# 06:00-10:00 UTC on weekdays), so an estimate is an upper bound on what was billed.
[models.deepseek-v4-pro]
input = 1.32
cache_read = 0.044
output = 3.96
