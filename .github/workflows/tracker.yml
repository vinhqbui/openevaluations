name: tracker

# Runs of the tracked agents on tallyho-cold, started by hand. The weekly schedule is off for now
# (owner, 2026-11-05): the workflow is kept as the place the tracker will run from. Runs are
# published as runs/*.jsonl through one pull request that merges itself once CI passes. Spends
# money (about $0.10 a leg on Claude Haiku 5.5; the budget input is split evenly over the legs);
# every leg is skipped unless the ANTHROPIC_API_KEY secret exists.
#
# Since 2026-11-20 every leg runs on claude-haiku-5-5 through Anthropic's own API (the amendment of
# that day in docs/PREREG-tracker-av.md). That is a new series: the DeepSeek Flash rows before it
# are a different model and are never pooled with these. No DeepSeek endpoint or key is used.
#
# Legs (one runner each), all on claude-haiku-5-5:
#   claude-code-cold  Claude Code as shipped
#   claude-code-av    Claude Code on the Margincode framework (agents/oe_agents/claude_code_av.py):
#                     av hooks, a daemon and a jj workspace per task; paired against the cold leg
#   opencode-cold     OpenCode, the second agent
#   goose-cold        Block's goose CLI, the third agent (Harbor's goose agent)
# Codex CLI is not a leg in this series: it speaks only OpenAI's Responses API, so it cannot run on
# an Anthropic key (the DeepSeek series ran it through agents/oe_agents/codex_deepseek.py).
# Both Claude Code legs install the same Claude Code version, read once per run in `prepare`, so
# the pairing compares the framework and nothing else; the version still moves week to week.
# OpenCode and goose are pinned the same way (npm for OpenCode, goose's latest GitHub release),
# through Harbor's `--ak version=`, so each row names the version that ran.
#
# Secrets: ANTHROPIC_API_KEY (an Anthropic API key; it replaces LLM_API_KEY, the DeepSeek key of
# the earlier series); TRACKER_PUSH_TOKEN (a fine-grained PAT with contents + pull-requests
# write; a PR opened with the default GITHUB_TOKEN does not trigger CI, so without it the PR waits
# for a manual merge).

on:
  # weekly schedule off for now; it was cron "0 5 * * 1" (Mondays 05:00 UTC)
  workflow_dispatch:
    inputs:
      budget_usd:
        description: "Cap for the whole run, USD"
        default: "2"

concurrency:
  group: tracker

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      claude_version: ${{ steps.v.outputs.claude_version }}
      opencode_version: ${{ steps.v.outputs.opencode_version }}
      goose_version: ${{ steps.v.outputs.goose_version }}
      has_key: ${{ steps.v.outputs.has_key }}
    steps:
      - id: v
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "claude_version=$(npm view @anthropic-ai/claude-code version)" >> "$GITHUB_OUTPUT"
          echo "opencode_version=$(npm view opencode-ai version)" >> "$GITHUB_OUTPUT"
          echo "goose_version=$(gh api repos/block/goose/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
          if [ -n "$KEY" ]; then echo "has_key=1" >> "$GITHUB_OUTPUT"; else
            echo "::notice::ANTHROPIC_API_KEY not set; no leg runs."; fi

  run:
    needs: prepare
    if: needs.prepare.outputs.has_key == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: claude-code-cold
            family: claude
            agent: claude-code
            arm: cold
            model: anthropic/claude-haiku-5-5
            extra: "--ak max_turns=40"
          - leg: claude-code-av
            family: claude
            agent: oe_agents.claude_code_av:ClaudeCodeAv
            arm: av
            model: anthropic/claude-haiku-5-5
            extra: "--ak max_turns=40 --ak av_version=release/0.0.4"
          - leg: opencode-cold
            family: opencode
            agent: opencode
            arm: cold
            model: anthropic/claude-haiku-5-5
            extra: ""
          - leg: goose-cold
            family: goose
            agent: goose
            arm: cold
            model: anthropic/claude-haiku-5-5
            extra: "--ak max_turns=40"
    env:
      BUDGET: ${{ github.event.inputs.budget_usd || '2' }}
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}/agents
      CLAUDE_VERSION: ${{ needs.prepare.outputs.claude_version }}
      OPENCODE_VERSION: ${{ needs.prepare.outputs.opencode_version }}
      GOOSE_VERSION: ${{ needs.prepare.outputs.goose_version }}
      LEGS: "4"   # the matrix size: each leg's share of the budget
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run tallyho-cold
        env:
          # Every CLI reads the Anthropic key as ANTHROPIC_API_KEY and calls api.anthropic.com.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OE_CACHE: ${{ runner.temp }}/oe-cache   # the Margincode release tarball (runner is a step-level context)
        run: |
          uv sync --frozen --extra run
          unset ANTHROPIC_BASE_URL ANTHROPIC_AUTH_TOKEN DEEPSEEK_API_KEY
          day=$(date -u +%F)
          job=tracker-tallyho-${{ matrix.leg }}-$day
          model="${{ matrix.model }}"
          extra="${{ matrix.extra }}"
          scholion_rev=null
          if [ "${{ matrix.family }}" = claude ]; then
            extra="$extra --ak version=$CLAUDE_VERSION"
            # every call of a session goes to the leg's model, not Claude Code's default small model
            for v in ANTHROPIC_DEFAULT_HAIKU_MODEL ANTHROPIC_SMALL_FAST_MODEL CLAUDE_CODE_SUBAGENT_MODEL; do
              extra="$extra --ae $v=${model#anthropic/}"
            done
          fi
          if [ "${{ matrix.family }}" = opencode ]; then
            extra="$extra --ak version=$OPENCODE_VERSION"
          fi
          if [ "${{ matrix.family }}" = goose ]; then
            # the release's installer installs the "stable" tag unless GOOSE_VERSION is set
            extra="$extra --ak version=$GOOSE_VERSION --ae GOOSE_VERSION=$GOOSE_VERSION"
          fi
          if [ "${{ matrix.arm }}" = av ]; then
            scholion_rev='"release/0.0.4"'
            uv run python -m oe_agents.av_settings fetch   # the pinned release, checked once before any trial
          fi
          kwargs=$(python3 -c 'import json,sys; a=sys.argv[1:]; print(json.dumps({k: int(v) if v.isdigit() else v for k, _, v in (a[i+1].partition("=") for i in range(len(a)) if a[i] == "--ak")}))' $extra)
          mkdir -p jobs/$job
          cat > jobs/$job/oe-env.json <<EOF
          {"dataset": "tallyho-cold", "arm": "${{ matrix.arm }}", "attempts": 3, "sandbox": "docker", "os": "linux",
           "harbor_version": "$(uv run harbor --version | tr -d '\n')", "openevaluations_rev": "${GITHUB_SHA::7}",
           "scholion_rev": $scholion_rev, "agent_kwargs": $kwargs, "prereg": "docs/PREREG-tracker-av.md",
           "source": "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
           "budget": {"cap_usd": $(python3 -c "print(round($BUDGET/$LEGS, 2))"), "spent_usd": null}}
          EOF
          uv run harbor run -p datasets/tallyho-cold -a "${{ matrix.agent }}" -m $model \
            -k 3 -n 4 -r 1 -o jobs --job-name $job --agent-setup-timeout-multiplier 2 $extra
          uv run oe budget jobs/$job --cap $(python3 -c "print($BUDGET/$LEGS)") || echo "::warning::budget cap reached"
          mkdir -p runs-new
          uv run oe import-harbor jobs/$job --machine github-actions --out runs-new
      - uses: actions/upload-artifact@v4
        with:
          name: runs-${{ matrix.leg }}
          path: runs-new/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobs-${{ matrix.leg }}
          path: jobs/
          retention-days: 90

  publish:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: runs-*
          merge-multiple: true
          path: runs/
      - name: Open the PR
        env:
          GH_TOKEN: ${{ secrets.TRACKER_PUSH_TOKEN || github.token }}
        run: |
          uv sync --frozen
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard runs)" ]; then
            echo "::warning::no leg produced a run"; exit 0; fi
          uv run oe detect && uv run oe validate && uv run oe site
          day=$(date -u +%F)
          branch=tracker/$day-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT   # a re-run must not collide with an earlier push
          git config user.name "openevaluations tracker"
          git config user.email "tracker@openevaluations.si"
          git switch -c $branch
          git add runs site/data
          git commit -m "tracker: $day"
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} $branch
          gh pr create --title "tracker: $day" --base main --head $branch \
            --body "Weekly tracker run ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Raw rows in runs/; trajectories in the run's jobs-* artifacts."
          gh pr merge --auto --squash $branch || echo "::notice::auto-merge unavailable; merge the PR by hand"
